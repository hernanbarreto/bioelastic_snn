name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Caché de datos (MNIST, Fashion, CIFAR-10, FSDD, texto)
        uses: actions/cache@v4
        with:
          path: data
          key: datos-v1
      - name: Dependencias
        run: pip install -e ".[dev]"
      - name: Pruebas
        run: python -m pytest -q
